# nginx — FlowerMatch PHP backend en VPS
# Ruta: /etc/nginx/sites-available/flowermatch-api
# Activar: ln -s /etc/nginx/sites-available/flowermatch-api /etc/nginx/sites-enabled/

server {
    listen 443 ssl http2;
    server_name api.tudominio.com;

    ssl_certificate     /etc/letsencrypt/live/api.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tudominio.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    root  /var/www/flowermatch/backend-php;
    index index.php;

    # Archivos sensibles: denegar siempre
    location ~ /\.(env|git|htpasswd) { deny all; return 404; }
    location ~ /logs/                { deny all; return 404; }
    location ~ /tests/               { deny all; return 404; }

    location ~ \.php$ {
        fastcgi_pass  unix:/run/php/php8.1-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        # fastcgi_params estándar no incluye HTTP_AUTHORIZATION; sin esta línea
        # $_SERVER['HTTP_AUTHORIZATION'] llega vacío y Bearer/JWT no funciona.
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        include       fastcgi_params;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

server {
    listen 80;
    server_name api.tudominio.com;
    return 301 https://$host$request_uri;
}
